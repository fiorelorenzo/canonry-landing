# The deploy workflow refuses to release a tag whose CI run here did not complete
# successfully, so job names are written for a human scanning the Actions tab rather
# than for brevity.
#
# Adapted from the canonry product repository's .github/workflows/ci.yml (this app
# used to be apps/landing there, covered by that repository's workspace-wide
# `pnpm -r --sequential` run): this workflow now runs this repository's own scripts
# directly, with no workspace and no Qdrant service, because this app never talks to
# vector search.
#
# Three tiers: `changes` scopes a PR to whether this app's own paths moved at all,
# `test` is the PR-path gate (lint, typecheck, unit tests, build, link check), and
# `docker-boot` (the image build + migration + served-health proof) only runs on
# push to main, because it needs several minutes and a live Postgres and nobody
# should wait on it before merging. `ci` is the one job a human or another workflow
# should ever look at; `deploy.yml`'s verify-ci.sh checks this workflow's overall run
# conclusion for a commit, not any one job inside it, so gating jobs behind `changes`
# or `docker-boot` behind `push` does not change what that gate sees.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Node version pinned here must track .node-version; pnpm/setup has no
# node-version-file input.
env:
  NODE_VERSION: 22.22.3

jobs:
  # PR-only. dorny/paths-filter answers from the API on a pull_request, so this job
  # needs no checkout and costs a few seconds. It is deliberately not used on push:
  # main always runs the full suite, which also spares us the fetch-depth: 0 that
  # filtering a push would require.
  changes:
    name: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level permissions replace the workflow-level block rather than merging
    # with it, so contents: read is repeated here. dorny/paths-filter lists the
    # PR's changed files through the GitHub API (no checkout, by design), which
    # needs pull-requests: read. A public repo's default token can list a PR's
    # files without it, but a private one can't ("Resource not accessible by
    # integration"), so this is granted uniformly rather than relying on that.
    # Every other job stays on the workflow-level contents: read only.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'migrations/**'
              - 'scripts/**'
              - 'static/**'
              - 'docker/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'svelte.config.js'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'eslint.config.js'
              - 'prettier.config.js'
              - '.node-version'

  test:
    name: Lint, typecheck, test, build
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check

      # No database service here: waitlist.test.ts passes a fake `postgres.Sql`
      # (see vite.config.ts's own comment on why), so the unit suite never needs a
      # real Postgres.
      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Issue #15: the door page links a world published on the prod stack, which nothing in
      # this repository builds and no unit test can reach. #13 checked that link by hand and
      # then refused to ship it because it answered 404; this is the same check, run every
      # time, so it cannot ship broken and cannot rot quietly. The only step here that needs
      # the public internet, and the failure it reports is "what we point at is down", which
      # is worth a red build on a page whose whole job is getting a stranger somewhere.
      - name: Every link off this site resolves
        run: pnpm check:links

  # Heavy: docker build, a live Postgres, a booted container. Main-only (see this
  # file's header comment); reproduced locally by `preflight`'s "image" check
  # (.github/preflight.json), which runs the same scripts/ci-image-boot.sh against
  # its own ephemeral Postgres.
  docker-boot:
    name: Build image, apply migration, verify served health
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: canonry
          POSTGRES_PASSWORD: canonry
          POSTGRES_DB: canonry_landing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - name: Build, boot, and verify the image
        env:
          DATABASE_URL: postgres://canonry:canonry@127.0.0.1:5432/canonry_landing
          CONTAINER_NAME: canonry-landing-ci
          IMAGE_TAG: canonry-landing:ci
        run: scripts/ci-image-boot.sh

      - name: Container logs
        if: always()
        run: docker logs canonry-landing-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f canonry-landing-ci || true

  # The single job worth looking at. `skipped` counts as passing: a docs-only PR
  # skips `test` and `docker-boot` never runs on a PR at all, and this still goes
  # green because the filter already proved there was nothing for either to say.
  ci:
    name: ci
    if: always()
    needs: [changes, test, docker-boot]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A needed job failed or was cancelled
        run: |
          printf '%s\n' '${{ toJSON(needs) }}'
          printf '%s' '${{ toJSON(needs) }}' | jq -e '
            to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled"))
            | length == 0'
