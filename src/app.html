<!doctype html>
<html lang="en" data-theme-pref>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- hooks.server.ts rewrites the html tag's lang attribute above and its
		     theme placeholder per request (issue #129, issue G1) - this comment lives
		     here, after both, on purpose: transformPageChunk's replace is a plain
		     first-match string swap, so explanatory prose earlier in the document must
		     never repeat either literal being replaced. -->
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!-- The alternate is the PNG rather than the ICO on purpose: adapter-node's mime table has
		no entry for .ico, so it serves with an empty content-type, which browsers sniff but
		crawlers and link unfurlers need not. The .ico file still ships at the root, because
		browsers ask for /favicon.ico by themselves without reading any of this. -->
		<link rel="alternate icon" type="image/png" href="/favicon-32.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#17140f" media="(prefers-color-scheme: dark)" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
