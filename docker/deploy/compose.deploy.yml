# Deployed-stack compose file for prodbox, same relationship to docker/compose.yml
# that the canonry product repository's own docker/deploy/compose.deploy.yml has to
# its docker/compose.yml: `image:` instead of `build:`, because the build happens once
# on a GitHub-hosted runner (.github/workflows/deploy.yml) and this file only ever
# runs on prodbox's self-hosted runner via scripts/deploy/release.sh.
#
# Bundles its own Postgres, same as the dev compose file and for the same reason: this
# repository owns its schema and its deployment independently of the canonry product
# repository's stack, so it does not join that stack's docker network or reach into
# its database - it never has to know that stack exists on the same box.
#
# One immutable copy of this file lives in every releases/<sha> directory
# (scripts/deploy/release.sh copies it in verbatim at deploy time), so a release's
# compose definition can never drift after the fact. Every invocation passes the same
# --project-name (canonry-landing-<stack>) regardless of which release directory is
# current, so postgres's named volume persists across releases - only the landing
# service's image tag differs release to release, so `docker compose up -d` recreates
# landing alone and leaves the postgres container and its data untouched. That one
# recreate is the other half of "rollback is a symlink flip plus a container recreate":
# flipping `current` to a different releases/<sha> and re-running this same command is
# the whole operation, forward or back.
#
# LANDING_IMAGE, APP_VERSION and APP_COMMIT are written into each release's own .env by
# release.sh, never edited by hand. Everything else (POSTGRES_*, ORIGIN, RESEND_API_KEY,
# MAIL_FROM) comes from the stack's shared secrets file (shared/secrets.env), managed on
# prodbox out of band and never generated or printed by any script here.
#
# No top-level `name:` here on purpose: every invocation of this file MUST pass
# --project-name canonry-landing-<stack> (scripts/deploy/lib.sh's compose_cmd does this
# always). Without it, prod and preview would default to the same project name and
# collide on the same box.

services:
  landing:
    image: ${LANDING_IMAGE}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${LANDING_PORT:-5195}:5195'
    environment:
      PORT: '5195'
      DATABASE_URL: ${DATABASE_URL}
      ORIGIN: ${ORIGIN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:5195/healthz").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
